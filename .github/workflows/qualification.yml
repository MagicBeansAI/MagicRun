name: Manual extraction qualification
# Deliberately no push/PR triggers: the extraction owner requested no checks or tests.
# Enabling automatic qualification is a later, explicit verification decision.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The portable production library must compile on Windows. Its Unix-only
      # execution fixtures are intentionally exercised by the runtime matrix.
      - run: cargo check --workspace --lib --bins
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The exec-roots Node test must not skip where a jail and node exist.
      MAGICRUN_REQUIRE_EXEC_ROOTS_NODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make test-build-paths
      - run: make test-architecture
      - run: make check
      - run: make test
      # Show that the macOS exec-roots jail tests ran rather than skipped.
      - if: runner.os == 'macOS'
        run: which node python3 && ls -ld /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/Current/bin/python3 || true
      - if: runner.os == 'macOS'
        run: cargo test -p tool-runtime-core --lib exec_roots -- --nocapture
  # The Linux jail paths (bubblewrap, the in-jail helper and egress forwarder,
  # interpreter mode, staged inputs) run for real here: skipped Linux jail
  # tests fail (MAGICRUN_REQUIRE_LINUX_JAIL=1). Three launch configurations:
  # unprivileged user namespaces; setuid bubblewrap that still creates a user
  # namespace; and setuid bubblewrap with user namespaces disabled, as in
  # containers without them (no exact task ceiling there, only the watchdog).
  linux-jail:
    strategy:
      fail-fast: false
      matrix:
        include:
          - bwrap: userns
            process_ceiling: "true"
          - bwrap: setuid
            process_ceiling: "true"
          - bwrap: setuid-no-userns
            process_ceiling: "false"
    runs-on: ubuntu-24.04
    env:
      MAGICRUN_REQUIRE_LINUX_JAIL: "1"
      MAGICRUN_REQUIRE_EXEC_ROOTS_NODE: "1"
      MAGICRUN_EXPECT_PROCESS_CEILING: ${{ matrix.process_ceiling }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap python3 jq curl perl
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - if: matrix.bwrap == 'userns'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.bwrap != 'userns'
        run: sudo chmod u+s /usr/bin/bwrap && ls -l /usr/bin/bwrap
      - if: matrix.bwrap == 'setuid-no-userns'
        run: sudo sysctl -w user.max_user_namespaces=0
      - run: cargo build -p tool-runtime-core --bin magicrun-jail-egress-forwarder
      - run: sudo install -D -o root -g root -m 0755 target/debug/magicrun-jail-egress-forwarder /usr/libexec/magicrun/magicrun-jail-egress-forwarder
      - run: ls -ld /usr/libexec /usr/libexec/magicrun && python3 --version && bwrap --version && cat /proc/sys/user/max_user_namespaces && which node && node --version
      - run: cargo test -p tool-runtime-core --lib governed_process_jail -- --nocapture
      - run: cargo test -p tool-runtime-core --lib governed_batch_process -- --nocapture
      - run: cargo test -p tool-runtime-core --test jail_egress_forwarder -- --nocapture
