name: Manual extraction qualification
# Deliberately no push/PR triggers: the extraction owner requested no checks or tests.
# Enabling automatic qualification is a later, explicit verification decision.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The portable production library must compile on Windows. Its Unix-only
      # execution fixtures are intentionally exercised by the runtime matrix.
      - run: cargo check --workspace --lib --bins
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test-build-paths
      - run: make test-architecture
      - run: make check
      - run: make test
